<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Core Ledger</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Core Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000;--slab:#15140f;--slab2:#201e17;--rule:#35322a;--text:#f4f1e4;--mute:#9d998b;
  --volt:#ffd000;--volt2:#d9b000;--hurt:#ff6a4d;
  --f:'Archivo',ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#000;--slab:#15140f;--text:#f4f1e4}}
:root[data-theme="dark"]{--ink:#000;--slab:#15140f;--text:#f4f1e4}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* type */
.disp{font-weight:850;font-stretch:125%;letter-spacing:-.02em;line-height:.92;margin:0}
.cond{font-stretch:62%}
h1.disp{font-size:clamp(44px,13vw,72px)}
h2{font-size:22px;font-weight:780;font-stretch:112%;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:17px;font-weight:720;margin:0 0 6px}
p{margin:0 0 10px}
.mute{color:var(--mute)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.volt{color:var(--volt)}

/* layout */
#app{max-width:560px;margin:0 auto;padding:18px 18px 118px;min-height:100%}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.stack>*+*{margin-top:12px}
.sec{margin-top:30px}
.panel{background:var(--slab);border-radius:18px;padding:16px}
.ruled>*{border-top:1px solid var(--rule);padding:12px 0}
.ruled>*:first-child{border-top:0}
hr{border:0;border-top:1px solid var(--rule);margin:18px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:16px;border:0;font-weight:760;font-size:17px;font-stretch:108%;background:var(--slab2);color:var(--text);text-decoration:none}
.btn.full{width:100%}
.btn.volt{background:var(--volt);color:#000}
.btn.volt:active{background:var(--volt2)}
.btn.line{background:transparent;border:1.5px solid var(--rule)}
.btn.ghost{background:transparent;min-height:44px;padding:0 10px;color:var(--mute);font-weight:600}
.btn.hurt{background:transparent;border:1.5px solid var(--hurt);color:var(--hurt)}
.btn.sm{min-height:40px;font-size:15px;padding:0 14px;border-radius:12px}
.btn[disabled]{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:9px 14px;font-size:15px;font-weight:600;min-height:42px}
.chip.on{background:var(--volt);border-color:var(--volt);color:#000}
.chip.hurton{background:var(--hurt);border-color:var(--hurt);color:#000}
.choice{display:block;width:100%;text-align:left;border:1.5px solid var(--rule);background:transparent;border-radius:16px;padding:16px;margin-top:10px}
.choice b{display:block;font-size:18px;font-weight:760}
.choice span{color:var(--mute);font-size:14.5px}
.choice.on{border-color:var(--volt);box-shadow:inset 0 0 0 1.5px var(--volt)}
.choice.on b{color:var(--volt)}

/* fields */
label.f{display:block;font-size:14px;color:var(--mute);margin-top:14px}
.inp{display:block;width:100%;margin-top:6px;background:var(--slab);border:1.5px solid var(--rule);border-radius:12px;padding:13px 14px;font-size:17px;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--volt);outline:none}
.unit{position:relative}
.unit em{position:absolute;right:14px;bottom:14px;font-style:normal;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--rule)}
.tog:first-child{border-top:0}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:99px;background:var(--rule);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--text);transition:transform .15s}
.switch:checked{background:var(--volt)}
.switch:checked::after{transform:translateX(20px);background:#000}

/* stepper */
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.stepper button{width:62px;height:62px;border-radius:50%;border:1.5px solid var(--rule);background:transparent;font-size:30px;font-weight:500;line-height:1}
.stepper .v{min-width:120px;text-align:center;font-size:64px;font-weight:850;font-stretch:62%;font-variant-numeric:tabular-nums;line-height:1}
.stepper .v small{display:block;font-size:14px;font-stretch:100%;font-weight:600;color:var(--mute)}

/* folio (30-day ledger) */
.folio{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule);margin-top:18px}
.cell{position:relative;aspect-ratio:1/1;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:6px 7px;font-size:13px;font-variant-numeric:tabular-nums;color:var(--mute);background:transparent;text-align:left;display:flex;flex-direction:column;justify-content:space-between;border-radius:0;border-top:0;border-left:0}
.cell b{font-weight:780;color:var(--text);font-size:15px}
.cell i{font-style:normal;font-size:11px}
.cell.rest b{color:var(--mute);font-weight:500}
.cell.done{background:var(--volt);color:#000}
.cell.done b{color:#000}
.cell.today{box-shadow:inset 0 0 0 2.5px var(--volt)}
.cell.miss b{text-decoration:line-through;text-decoration-color:var(--hurt);color:var(--mute)}
.cell.fut{opacity:.7}
.cell.final i{color:var(--volt)}
.cell.done.final i{color:#000}

/* entry lines (session preview & history) */
.entry{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 0;border-top:1px solid var(--rule);align-items:baseline}
.entry:first-child{border-top:0}
.entry .n{font-weight:680}
.entry .q{font-variant-numeric:tabular-nums;font-weight:760;font-stretch:90%;text-align:right;white-space:nowrap}
.entry .s{grid-column:1/-1;font-size:13.5px;color:var(--mute);margin-top:-2px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--rule);border-radius:6px;padding:1px 6px;margin-right:4px;color:var(--mute)}
.tag.v{border-color:var(--volt);color:var(--volt)}
.tag.h{border-color:var(--hurt);color:var(--hurt)}

/* stats */
.tot{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--rule)}
.tot div{padding:14px 0 12px;border-bottom:1px solid var(--rule)}
.tot div:nth-child(odd){padding-right:12px;border-right:1px solid var(--rule)}
.tot div:nth-child(even){padding-left:14px}
.tot b{display:block;font-size:34px;font-weight:850;font-stretch:62%;line-height:1;font-variant-numeric:tabular-nums}
.tot span{font-size:13.5px;color:var(--mute)}
.bar{margin-top:12px}
.bar .t{display:flex;justify-content:space-between;font-size:14px}
.bar .track{position:relative;height:12px;background:var(--slab2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar .zone{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--mute);border-right:1.5px dashed var(--mute)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--volt);border-radius:3px}
.chart{width:100%;height:auto;display:block}
.scrollx{overflow-x:auto}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{background:none;border:0;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--volt)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--slab);border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out;border-top:1px solid var(--rule)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--rule);margin:2px auto 14px}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* player */
.player{position:fixed;inset:0;z-index:60;background:var(--ink);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:hidden}
.player .top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;position:relative;z-index:3}
.player .body{flex:1;display:flex;flex-direction:column;overflow-y:auto;position:relative;z-index:2;max-width:560px;width:100%;margin:0 auto}
.player .foot{position:relative;z-index:3;max-width:560px;width:100%;margin:0 auto}
.prog{display:flex;gap:3px;margin:6px 0 2px}
.player .prog{margin-bottom:16px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.prog i.d{background:var(--volt)}
.prog i.c{background:var(--text)}
.exname{font-size:clamp(34px,10.5vw,54px)}
.target{display:flex;align-items:baseline;gap:12px;margin-top:18px}
.target .big{font-size:clamp(88px,30vw,150px);font-weight:880;font-stretch:62%;line-height:.85;color:var(--volt);font-variant-numeric:tabular-nums}
.target .lab{font-size:18px;font-weight:650;line-height:1.2}
.setdots{display:flex;gap:6px;margin-top:6px}
.setdots i{width:26px;height:8px;border-radius:2px;border:1.5px solid var(--rule)}
.setdots i.d{background:var(--volt);border-color:var(--volt)}
.setdots i.c{border-color:var(--volt)}
.media{margin-top:16px;border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:#fff;align-self:flex-start}
.media img{display:block;width:180px;height:180px}
.media small{display:block;background:var(--slab);color:var(--mute);font-size:11px;padding:4px 8px}
.cue{font-size:16px;color:var(--text);opacity:.88;max-width:62ch;margin-top:16px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts .btn{flex:1;white-space:nowrap}
.btn.inkv{background:#000;color:var(--volt);box-shadow:inset 0 0 0 2px var(--volt)}
.btn.inkv:active{background:#1a1700}

/* timer */
.clock{position:absolute;inset:0;z-index:1;pointer-events:none}
.clock .flood{position:absolute;left:0;right:0;bottom:0;height:var(--p,0%);background:var(--volt);transition:height .25s linear}
.clock .n{position:absolute;left:0;right:0;top:50%;transform:translateY(-54%);text-align:center;font-size:min(58vw,60vh);font-weight:900;font-stretch:62%;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.clock .n.a{color:var(--volt)}
.clock .n.long{font-size:min(36vw,40vh)}
.bigtime.long{font-size:min(30vw,26vh)}
.clock .n.b{color:#000;clip-path:inset(calc(100% - var(--pp,0%)) 0 0 0)}
.clock .lab{position:absolute;left:0;right:0;top:calc(50% + min(24vw,25vh));text-align:center;font-weight:700;font-size:18px}
.rest .n.a{font-size:min(46vw,44vh)}
.restbar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:10px 0 16px}
.restbar i{display:block;height:100%;background:var(--volt);transition:width .25s linear}
.bigtime{font-size:min(36vw,30vh);white-space:nowrap;font-weight:900;font-stretch:62%;line-height:.9;color:var(--volt);font-variant-numeric:tabular-nums;text-align:center;margin:6vh 0 2vh}

.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:120;background:var(--text);color:#000;font-weight:650;padding:12px 18px;border-radius:14px;max-width:88vw;animation:rise .2s ease-out}
.note{border-left:3px solid var(--volt);padding:4px 0 4px 12px;margin:12px 0}
.note.h{border-color:var(--hurt)}
.hero-mark{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hero-mark .of{font-size:22px;font-weight:700;color:var(--mute);font-stretch:100%}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="player"></div>
<div id="sheet"></div>
<div class="tabbar" id="tabbar" hidden></div>
<script>
"use strict";
/* ===== Exercise library =====
   pat: movement pattern; lvl: 0 easiest → 5 hardest; mode: reps | hold | timed
   load: 'db' | 'ez' | null; kg: suggested start load [new, some, trained]; dbn: dumbbells used
   range: rep range; hold: [start secs, cap secs]; uni: per side; stress: joints it loads (for pain logic)
   ds: dataset name aliases used to match animations from exercises.json
   No exercise in this library involves jumping. */
const X = {};
function ex(id, name, pat, lvl, o = {}) {
  X[id] = Object.assign({ id, name, pat, lvl, mode: 'reps', eq: [], load: null, kg: null, dbn: 1, range: [8, 15], hold: [20, 45],
    uni: false, m: [], m2: [], stress: [], rest: 60, cue: '', ds: [], timed: false }, o);
}

/* warm-up (dynamic, timed) */
ex('w_catcow', 'Cat–cow', 'warm', 1, { mode: 'hold', hold: [40, 40], m: ['lowback'], cue: 'On hands and knees. Round your back up as you breathe out, let it sink gently as you breathe in. Slow and smooth.', ds: ['cat cow', 'cat stretch'] });
ex('w_hips', 'Hip circles', 'warm', 1, { mode: 'hold', hold: [30, 30], cue: 'Hands on hips, draw big slow circles with your pelvis. Switch direction halfway.', ds: ['hip circles'] });
ex('w_arms', 'Arm circles', 'warm', 1, { mode: 'hold', hold: [30, 30], cue: 'Arms out to the sides. Small circles that grow bigger, reverse halfway.', ds: ['arm circles'] });
ex('w_wgs', 'World’s greatest stretch', 'warm', 1, { mode: 'hold', hold: [40, 40], cue: 'Step into a long lunge, hand inside the front foot, rotate the other arm to the ceiling. Alternate sides slowly — step, don’t hop.', ds: ['world greatest stretch'] });
ex('w_walk', 'Walkout', 'warm', 1, { mode: 'hold', hold: [40, 40], cue: 'Hinge down, walk your hands out to a plank, walk them back and stand tall. Bend the knees as much as you need.', ds: ['inchworm'] });
ex('w_bridge', 'Glute bridge pulses', 'warm', 1, { mode: 'hold', hold: [30, 30], cue: 'On your back, feet flat. Drive hips up, squeeze, lower halfway, repeat at an easy pace.', ds: ['low glute bridge on floor'] });
ex('w_scap', 'Scapular pull-ups', 'warm', 1, { mode: 'hold', hold: [30, 30], eq: ['bar'], cue: 'Hang with straight arms. Pull the shoulder blades down and back without bending the elbows, then relax. Easy reps.', ds: ['scapula pull-up', 'scapular pull-up'] });
ex('w_birddog', 'Slow bird dog', 'warm', 1, { mode: 'hold', hold: [40, 40], cue: 'On all fours, reach opposite arm and leg long, pause, switch. Keep your hips level.' });
ex('w_turns', 'Standing torso turns', 'warm', 1, { mode: 'hold', hold: [30, 30], cue: 'Feet planted, arms loose. Rotate from the ribs side to side, a little wider each time.', ds: ['standing twist'] });

/* cool-down (static stretches) */
ex('c_cobra', 'Cobra stretch', 'cool', 1, { mode: 'hold', hold: [40, 40], m: ['abs'], cue: 'Face down, hands under shoulders. Press your chest up while your hips stay heavy. Breathe into the belly.', ds: ['cobra', 'upward facing dog'] });
ex('c_child', 'Child’s pose', 'cool', 1, { mode: 'hold', hold: [45, 45], m: ['lowback'], cue: 'Knees wide, hips back to heels, arms long in front. Let your lower back widen with each breath.', ds: ['child pose'] });
ex('c_twist', 'Lying spinal twist', 'cool', 1, { mode: 'hold', hold: [30, 30], uni: true, m: ['obl'], cue: 'On your back, drop both knees to one side, arms out wide, look the other way. Shoulders stay down.', ds: ['lying spinal twist'] });
ex('c_hipflex', 'Kneeling hip-flexor stretch', 'cool', 1, { mode: 'hold', hold: [35, 35], uni: true, m: ['hipflex'], cue: 'Half-kneeling, tuck the tailbone and squeeze the back-leg glute. Shift forward a little. Reach the same-side arm up.', ds: ['kneeling hip flexor stretch'] });
ex('c_ham', 'Lying hamstring stretch', 'cool', 1, { mode: 'hold', hold: [35, 35], uni: true, m: ['hams'], cue: 'On your back, raise one straight leg and hold behind the thigh. Keep the other leg long on the floor.', ds: ['hamstring stretch'] });
ex('c_fig4', 'Figure-4 glute stretch', 'cool', 1, { mode: 'hold', hold: [35, 35], uni: true, m: ['glutes'], cue: 'On your back, ankle over the opposite knee, pull that thigh toward you. Keep the crossed knee opening out.', ds: ['figure 4 stretch'] });
ex('c_side', 'Standing side reach', 'cool', 1, { mode: 'hold', hold: [25, 25], uni: true, m: ['obl'], cue: 'Feet together, reach one arm up and over. Feel the stretch along the side of the waist.', ds: ['side bend stretch'] });
ex('c_hang', 'Dead hang', 'cool', 1, { mode: 'hold', hold: [30, 30], eq: ['bar'], m: ['back'], cue: 'Hang relaxed and let your shoulders and spine lengthen. Step down when your grip fades.', ds: ['dead hang'] });
ex('c_thread', 'Thread the needle', 'cool', 1, { mode: 'hold', hold: [30, 30], uni: true, m: ['back'], cue: 'On all fours, slide one arm under your body and rest that shoulder down. Breathe into the upper back.' });
ex('c_quad', 'Side-lying quad stretch', 'cool', 1, { mode: 'hold', hold: [30, 30], uni: true, m: ['quads'], cue: 'Lying on your side, hold the top ankle and bring the heel toward your glute. Knees stay together.', ds: ['side lying quadriceps stretch'] });
ex('c_chest', 'Doorway chest stretch', 'cool', 1, { mode: 'hold', hold: [30, 30], m: ['chest'], cue: 'Forearms on a door frame at shoulder height, step through gently until the chest opens.' });

/* upper-abs flexion */
ex('crunch', 'Crunch', 'flex', 1, { range: [12, 25], timed: true, m: ['abs'], stress: ['neck'], cue: 'Feet flat, fingertips lightly behind your ears. Breathe out and curl your ribs toward your hips — shoulder blades lift, lower back stays down. Lower slowly.', ds: ['crunch floor', 'crunch (hands overhead)'] });
ex('lacrunch', 'Long-arm crunch', 'flex', 2, { range: [10, 20], timed: true, m: ['abs'], stress: ['neck'], cue: 'Arms straight overhead, biceps by your ears. The longer lever makes the same curl harder. Pause at the top.', ds: ['crunch (hands overhead)'] });
ex('situp', 'Sit-up', 'flex', 2, { range: [10, 25], timed: true, m: ['abs'], m2: ['hipflex'], stress: ['lowback', 'neck'], cue: 'Curl up one vertebra at a time, then sit tall. Roll down slower than you came up. Hook your feet under the bench if needed.', ds: ['sit-up v. 2', '3/4 sit-up', 'sit-up'] });
ex('wcrunch', 'Weighted crunch', 'flex', 3, { load: 'db', kg: [4, 8, 12], range: [8, 20], m: ['abs'], stress: ['neck'], cue: 'One dumbbell held on your chest. Curl the ribs down hard, pause one beat at the top, lower over 2 seconds.', ds: ['weighted crunch', 'dumbbell crunch'] });
ex('vup', 'V-up', 'flex', 4, { range: [8, 20], timed: true, m: ['abs'], m2: ['hipflex'], stress: ['lowback'], rest: 75, cue: 'Lie long, then fold: hands reach toward shins as your legs rise. Lower both halves slowly — no crashing down.', ds: ['v-up'] });
ex('wsitup', 'Weighted sit-up', 'flex', 4, { load: 'db', kg: [5, 10, 15], range: [8, 15], m: ['abs'], m2: ['hipflex'], stress: ['lowback'], rest: 75, cue: 'Dumbbell at your chest, feet anchored under the bench. Curl up under control, take 3 seconds to lower.', ds: ['weighted sit-up', 'dumbbell sit-up'] });

/* lower-abs flexion */
ex('revcrunch', 'Reverse crunch', 'rflex', 1, { range: [10, 20], timed: true, m: ['abs'], cue: 'Knees bent at 90°, hands by your sides. Breathe out and roll your hips off the floor toward your ribs. Lower over 2 seconds — no swinging.', ds: ['reverse crunch'] });

function chart(pts, unit) {

  const X_ = x => P + (x - x0) / (x1 - x0 || 1) * (W - 2 * P), Y_ = y => H - P - (y - y0) / (y1 - y0 || 1) * (H - 2 * P);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X_(xs[i]).toFixed(1)},${Y_(p[1]).toFixed(1)}`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="${unit} over time"><path d="${d}" fill="none" stroke="var(--volt)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p, i) => `<circle cx="${X_(xs[i])}" cy="${Y_(p[1])}" r="3" fill="var(--volt)"/>`).join('')}<text x="${P}" y="${H + 14}" fill="var(--mute)" font-size="11">${shortDate(pts[0][0])}</text><text x="${W - P}" y="${H + 14}" fill="var(--mute)" font-size="11" text-anchor="end">${fmtKg(ys[ys.length - 1])} ${unit}</text></svg>`;
}

/* dataset matching */
let DS = undefined;
function dsGet() { if (DS === undefined) { try { DS = JSON.parse(localStorage.getItem(LS_DS) || 'null'); } catch (e) { DS = null; } } return DS; }
function dsSave() { try { localStorage.setItem(LS_DS, JSON.stringify(DS)); } catch (e) { toast('Not enough storage for the animation index'); } }
const normN = s => String(s).toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
function buildDataset(arr) {
  const idx = arr.map(r => ({ n: r.name, k: normN(r.name), g: r.gif_url, q: r.equipment || '', s: (r.instructions && r.instructions.en) || '' }));
  const map = {};
  for (const e of Object.values(X)) {
    let hit = null;
    for (const a of e.ds) { hit = idx.find(r => r.k === normN(a)); if (hit) break; }
    if (!hit) {
      const want = new Set(normN(e.name).split(' ').filter(w => w.length > 2));
      let best = 0;
      for (const r of idx) {
        const tk = new Set(r.k.split(' ').filter(w => w.length > 2)); let inter = 0; want.forEach(w => { if (tk.has(w)) inter++; });
        let sc = inter / (want.size + tk.size - inter || 1);
        if (e.load === 'db' && !/dumbbell/.test(r.q)) sc -= .3; if (e.load === 'ez' && !/ez|barbell/.test(r.q)) sc -= .3; if (!e.load && !e.eq.includes('ez') && /body weight/.test(r.q)) sc += .1;
        if (sc > best) { best = sc; hit = r; }
      }
      if (best < 0.5) hit = null;
    }
    if (hit) map[e.id] = { n: hit.n, g: hit.g, steps: hit.s.slice(0, 700) };
  }
  DS = { map, names: idx.map(r => [r.n, r.g, r.s.slice(0, 700)]) }; dsSave();
}

  if (r.pain) { S.avoid[r.pain] = addDays(today(), 1); PL.adapt.push(`${AREAS[r.pain]} rested today`); }
  const rm = score <= -2 ? 0.75 : 1;
  if (rm < 1 || r.pain) { PL.plan = planDay(PL.d, { readiness: rm }); if (rm < 1) PL.adapt.push('Lighter session: fewer sets because recovery looked low'); }

  if (v === 'count') return `${head}<div class="clock" id="clock"><div class="flood"></div><div class="n a tnum">${fmtS(Math.ceil(timeLeft()))}</div><div class="n b tnum">${fmtS(Math.ceil(timeLeft()))}</div></div><div class="body"><h2 class="disp exname" style="font-size:36px">${esc(t.n)}</h2><p class="mute">Count your reps</p></div><div class="foot"><button class="btn inkv full" data-a="pSkip">Stop early</button></div>`;
  if (v === 'tlog') return `${head}<div class="body"><h2 class="disp exname" style="font-size:40px;margin-top:10px">How many?</h2><div class="stepper"><button data-a="tCnt" data-v="-1">−</button><div class="v">${PL.cnt}<small>crunches</small></div><button data-a="tCnt" data-v="1">+</button></div><div class="row" style="justify-content:center"><button class="btn sm line" data-a="tCnt" data-v="-5">−5</button><button class="btn sm line" data-a="tCnt" data-v="5">+5</button></div></div><div class="foot"><button class="btn volt full" data-a="tSaveCnt">Save</button></div>`;
  if (v === 'tbody') { const last = [...S.body].reverse().find(b => b.waist) || {}; return `${head}<div class="body"><h2 class="disp exname" style="font-size:40px;margin-top:10px">Measurements</h2><p class="mute small">Optional but worth it — the waist tells you more than the scale.</p><div class="two"><label class="f">Weight<div class="unit"><input class="inp" id="tw" inputmode="decimal" value="${latestWeight()}"><em>kg</em></div></label><label class="f">Waist at navel<div class="unit"><input class="inp" id="twa" inputmode="decimal" value="${last.waist ?? ''}"><em>cm</em></div></label><label class="f">Neck<div class="unit"><input class="inp" id="tn2" inputmode="decimal" value="${last.neck ?? ''}"><em>cm</em></div></label>${S.profile.sex === 'f' ? `<label class="f">Hips<div class="unit"><input class="inp" id="th" inputmode="decimal" value="${last.hip ?? ''}"><em>cm</em></div></label>` : ''}</div></div><div class="foot"><button class="btn volt full" data-a="tFinish">Save results</button></div>`; }
  if (v === 'tsum') { const base = PL.tkind === 'final' ? S.tests.filter(x => x.kind === 'base' && x.start === S.start).slice(-1)[0] : null; return `${head}<div class="body"><h1 class="disp" style="font-size:clamp(48px,14vw,80px);margin-top:10px">${PL.tkind === 'final' ? 'Thirty days.' : 'On the books.'}</h1><div style="margin-top:18px">${testCompare(base || PL.res, base ? PL.res : null)}</div><p class="mute small" style="margin-top:12px">${PL.tkind === 'final' ? 'Compare with day 1 above.' : 'Your hold targets now start from these numbers.'}</p></div><div class="foot"><button class="btn volt full" data-a="pClose">Done</button></div>`; }
  return head;
}
/* ===== boot ===== */
loadLocal();
render();
connectCloud();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && PL && typeof renderPlayer === 'function') { try { renderPlayer(); } catch (e) { } } });
(function () {
  try {
    const okHost = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (!window.claude && okHost && 'serviceWorker' in navigator && !/claude\.(ai|site)|claudeusercontent/.test(location.hostname)) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
    }
  } catch (e) { }
})();
</script>
</body>
